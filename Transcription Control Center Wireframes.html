<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TITAN CC — Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f0ede8; font-family: 'Caveat', cursive; }

  .sk-box {
    border: 1.5px solid #1a1a1a;
    border-radius: 3px;
    background: #fafaf8;
    box-shadow: 2px 2px 0 #1a1a1a;
  }
  .sk-box-ghost { border: 1.5px dashed #aaa; border-radius: 3px; background: #f5f5f2; }
  .sk-label { font-family: 'Caveat', cursive; font-size: 13px; color: #555; }
  .sk-title { font-family: 'Caveat', cursive; font-weight: 700; color: #1a1a1a; }
  .sk-badge {
    display: inline-block;
    padding: 1px 7px;
    border: 1.5px solid #1a1a1a;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'Caveat', cursive;
    font-weight: 600;
  }
  .sk-btn {
    border: 1.5px solid #1a1a1a;
    border-radius: 4px;
    background: #1a1a1a;
    color: #fafaf8;
    padding: 4px 12px;
    font-family: 'Caveat', cursive;
    font-size: 14px;
    cursor: default;
    box-shadow: 1px 1px 0 #555;
  }
  .sk-btn-ghost {
    border: 1.5px solid #1a1a1a;
    border-radius: 4px;
    background: transparent;
    padding: 4px 12px;
    font-family: 'Caveat', cursive;
    font-size: 14px;
    cursor: default;
  }
  .sk-divider { border: none; border-top: 1.5px solid #ccc; margin: 6px 0; }
  .sk-img {
    background: repeating-linear-gradient(45deg, #e8e5e0, #e8e5e0 3px, #f0ede8 3px, #f0ede8 10px);
    border: 1.5px solid #bbb;
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Caveat', cursive; font-size: 12px; color: #888;
    text-align: center;
  }

  .acc-red    { background: #fde8e8; border-color: #c0392b; color: #c0392b; }
  .acc-orange { background: #fef3e2; border-color: #e67e22; color: #e67e22; }
  .acc-green  { background: #e8f8ee; border-color: #27ae60; color: #27ae60; }
  .acc-blue   { background: #e8f0fd; border-color: #2980b9; color: #2980b9; }

  .shell { display: flex; width: 100%; height: 100%; }
  .main-area { flex: 1; padding: 20px; overflow: hidden; background: #fafaf8; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .wf-table { width: 100%; border-collapse: collapse; font-family: 'Caveat', cursive; font-size: 14px; }
  .wf-table th { text-align: left; border-bottom: 1.5px solid #1a1a1a; padding: 5px 8px; font-weight: 700; font-size: 12px; color: #555; }
  .wf-table td { padding: 6px 8px; border-bottom: 1px solid #e0ddd8; vertical-align: middle; }
  .wf-table tr:hover td { background: #f5f2ed; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
</style>
</head>
<body>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useContext, useCallback, Children } = React;

/* ── Design-canvas inline ───────────────────────────────────────────────── */
const DC = {
  bg: '#f0eee9', grid: 'rgba(0,0,0,0.06)', label: 'rgba(60,50,40,0.7)',
  title: 'rgba(40,30,20,0.85)', subtitle: 'rgba(60,50,40,0.6)',
  font: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
};

if (!document.getElementById('dc-styles')) {
  const s = document.createElement('style');
  s.id = 'dc-styles';
  s.textContent = [
    '.dc-editable{cursor:text;outline:none;white-space:nowrap;border-radius:3px;padding:0 2px;margin:0 -2px}',
    '.dc-editable:focus{background:#fff;box-shadow:0 0 0 1.5px #c96442}',
    '[data-dc-slot]{transition:transform .18s cubic-bezier(.2,.7,.3,1)}',
    '[data-dc-slot].dc-dragging{transition:none;z-index:10;pointer-events:none}',
    '[data-dc-slot].dc-dragging .dc-card{box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 0 2px #c96442;transform:scale(1.02)}',
    '.dc-card{transition:box-shadow .15s,transform .15s}',
    '.dc-card *{scrollbar-width:none}',
    '.dc-card *::-webkit-scrollbar{display:none}',
    '.dc-labelrow{display:flex;align-items:center;gap:4px;height:24px}',
    '.dc-grip{cursor:grab;display:flex;align-items:center;padding:5px 4px;border-radius:4px;transition:background .12s}',
    '.dc-grip:hover{background:rgba(0,0,0,.08)}',
    '.dc-grip:active{cursor:grabbing}',
    '.dc-labeltext{cursor:pointer;border-radius:4px;padding:3px 6px;display:flex;align-items:center;transition:background .12s}',
    '.dc-labeltext:hover{background:rgba(0,0,0,.05)}',
    '.dc-expand{position:absolute;bottom:100%;right:0;margin-bottom:5px;z-index:2;opacity:0;transition:opacity .12s,background .12s;width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;padding:0;background:transparent;color:rgba(60,50,40,.7);display:flex;align-items:center;justify-content:center}',
    '.dc-expand:hover{background:rgba(0,0,0,.06);color:#2a251f}',
    '[data-dc-slot]:hover .dc-expand{opacity:1}',
  ].join('\n');
  document.head.appendChild(s);
}

const DCCtx = React.createContext(null);

function DesignCanvas({ children, minScale = 0.1, maxScale = 8, style = {} }) {
  const [state, setState] = useState({ sections: {}, focus: null });
  const [ready, setReady] = useState(false);
  useEffect(() => { const t = setTimeout(() => setReady(true), 50); return () => clearTimeout(t); }, []);

  const registry = {};
  const sectionMeta = {};
  const sectionOrder = [];
  Children.forEach(children, (sec) => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    if (!sid) return;
    sectionOrder.push(sid);
    const persisted = state.sections[sid] || {};
    const srcIds = [];
    Children.forEach(sec.props.children, (ab) => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      if (!aid) return;
      registry[`${sid}/${aid}`] = { sectionId: sid, artboard: ab };
      srcIds.push(aid);
    });
    const kept = (persisted.order || []).filter((k) => srcIds.includes(k));
    sectionMeta[sid] = {
      title: persisted.title ?? sec.props.title,
      subtitle: sec.props.subtitle,
      slotIds: [...kept, ...srcIds.filter((k) => !kept.includes(k))],
    };
  });

  const api = useMemo(() => ({
    state,
    section: (id) => state.sections[id] || {},
    patchSection: (id, p) => setState((s) => ({
      ...s,
      sections: { ...s.sections, [id]: { ...s.sections[id], ...(typeof p === 'function' ? p(s.sections[id] || {}) : p) } },
    })),
    setFocus: (slotId) => setState((s) => ({ ...s, focus: slotId })),
  }), [state]);

  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') api.setFocus(null); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [api]);

  return (
    <DCCtx.Provider value={api}>
      <DCViewport minScale={minScale} maxScale={maxScale} style={style}>{ready && children}</DCViewport>
      {state.focus && registry[state.focus] && (
        <DCFocusOverlay entry={registry[state.focus]} sectionMeta={sectionMeta} sectionOrder={sectionOrder} />
      )}
    </DCCtx.Provider>
  );
}

function DCViewport({ children, minScale = 0.1, maxScale = 8, style = {} }) {
  const vpRef = useRef(null);
  const worldRef = useRef(null);
  const tf = useRef({ x: 0, y: 0, scale: 1 });
  const apply = useCallback(() => {
    const { x, y, scale } = tf.current;
    if (worldRef.current) worldRef.current.style.transform = `translate3d(${x}px,${y}px,0) scale(${scale})`;
  }, []);
  useEffect(() => {
    const vp = vpRef.current;
    if (!vp) return;
    const zoomAt = (cx, cy, factor) => {
      const r = vp.getBoundingClientRect();
      const px = cx - r.left, py = cy - r.top;
      const t = tf.current;
      const next = Math.min(maxScale, Math.max(minScale, t.scale * factor));
      const k = next / t.scale;
      t.x = px - (px - t.x) * k; t.y = py - (py - t.y) * k; t.scale = next; apply();
    };
    const isMouseWheel = (e) => e.deltaMode !== 0 || (e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 40);
    let isGesturing = false;
    const onWheel = (e) => {
      e.preventDefault();
      if (isGesturing) return;
      if (e.ctrlKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
      else if (isMouseWheel(e)) zoomAt(e.clientX, e.clientY, Math.exp(-Math.sign(e.deltaY) * 0.18));
      else { tf.current.x -= e.deltaX; tf.current.y -= e.deltaY; apply(); }
    };
    let gsBase = 1;
    const onGS = (e) => { e.preventDefault(); isGesturing = true; gsBase = tf.current.scale; };
    const onGC = (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, (gsBase * e.scale) / tf.current.scale); };
    const onGE = (e) => { e.preventDefault(); isGesturing = false; };
    let drag = null;
    const onPD = (e) => {
      const onBg = !e.target.closest('[data-dc-slot],.dc-editable');
      if (!(e.button === 1 || (e.button === 0 && onBg))) return;
      e.preventDefault(); vp.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY }; vp.style.cursor = 'grabbing';
    };
    const onPM = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      tf.current.x += e.clientX - drag.lx; tf.current.y += e.clientY - drag.ly;
      drag.lx = e.clientX; drag.ly = e.clientY; apply();
    };
    const onPU = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      vp.releasePointerCapture(e.pointerId); drag = null; vp.style.cursor = '';
    };
    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('gesturestart', onGS, { passive: false });
    vp.addEventListener('gesturechange', onGC, { passive: false });
    vp.addEventListener('gestureend', onGE, { passive: false });
    vp.addEventListener('pointerdown', onPD);
    vp.addEventListener('pointermove', onPM);
    vp.addEventListener('pointerup', onPU);
    vp.addEventListener('pointercancel', onPU);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('gesturestart', onGS);
      vp.removeEventListener('gesturechange', onGC);
      vp.removeEventListener('gestureend', onGE);
      vp.removeEventListener('pointerdown', onPD);
      vp.removeEventListener('pointermove', onPM);
      vp.removeEventListener('pointerup', onPU);
      vp.removeEventListener('pointercancel', onPU);
    };
  }, [apply, minScale, maxScale]);
  const gridSvg = `url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='${encodeURIComponent(DC.grid)}' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div ref={vpRef} style={{ height:'100vh',width:'100vw',background:DC.bg,overflow:'hidden',overscrollBehavior:'none',touchAction:'none',position:'relative',fontFamily:DC.font,...style }}>
      <div ref={worldRef} style={{ position:'absolute',top:0,left:0,transformOrigin:'0 0',willChange:'transform',width:'max-content',minWidth:'100%',minHeight:'100%',padding:'60px 0 80px' }}>
        <div style={{ position:'absolute',inset:-6000,backgroundImage:gridSvg,backgroundSize:'120px 120px',pointerEvents:'none',zIndex:-1 }}/>
        {children}
      </div>
    </div>
  );
}

function DCSection({ id, title, subtitle, children, gap = 48 }) {
  const ctx = useContext(DCCtx);
  const sid = id ?? title;
  const all = Children.toArray(children);
  const artboards = all.filter((c) => c && c.type === DCArtboard);
  const rest = all.filter((c) => !(c && c.type === DCArtboard));
  const srcOrder = artboards.map((a) => a.props.id ?? a.props.label);
  const sec = (ctx && sid && ctx.section(sid)) || {};
  const order = useMemo(() => {
    const kept = (sec.order || []).filter((k) => srcOrder.includes(k));
    return [...kept, ...srcOrder.filter((k) => !kept.includes(k))];
  }, [sec.order, srcOrder.join('|')]);
  const byId = Object.fromEntries(artboards.map((a) => [a.props.id ?? a.props.label, a]));
  return (
    <div data-dc-section={sid} style={{ marginBottom:80,position:'relative' }}>
      <div style={{ padding:'0 60px 56px' }}>
        <DCEditable tag="div" value={sec.title ?? title} onChange={(v) => ctx && sid && ctx.patchSection(sid, { title: v })}
          style={{ fontSize:28,fontWeight:600,color:DC.title,letterSpacing:-0.4,marginBottom:6,display:'inline-block' }}/>
        {subtitle && <div style={{ fontSize:16,color:DC.subtitle }}>{subtitle}</div>}
      </div>
      <div style={{ display:'flex',gap,padding:'0 60px',alignItems:'flex-start',width:'max-content' }}>
        {order.map((k) => (
          <DCArtboardFrame key={k} sectionId={sid} artboard={byId[k]} order={order}
            label={(sec.labels||{})[k] ?? byId[k].props.label}
            onRename={(v) => ctx && ctx.patchSection(sid, (x) => ({ labels:{ ...x.labels,[k]:v }}))}
            onReorder={(next) => ctx && ctx.patchSection(sid, { order: next })}
            onFocus={() => ctx && ctx.setFocus(`${sid}/${k}`)}/>
        ))}
      </div>
      {rest}
    </div>
  );
}

function DCArtboard() { return null; }

function DCArtboardFrame({ sectionId, artboard, label, order, onRename, onReorder, onFocus }) {
  const { id: rawId, label: rawLabel, width=260, height=480, children, style={} } = artboard.props;
  const id = rawId ?? rawLabel;
  const ref = useRef(null);
  const onGripDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    const me = ref.current;
    const scale = me.getBoundingClientRect().width / me.offsetWidth || 1;
    const peers = Array.from(document.querySelectorAll(`[data-dc-section="${sectionId}"] [data-dc-slot]`));
    const homes = peers.map((el) => ({ el, id: el.dataset.dcSlot, x: el.getBoundingClientRect().left }));
    const slotXs = homes.map((h) => h.x);
    const startIdx = order.indexOf(id);
    const startX = e.clientX;
    let liveOrder = order.slice();
    me.classList.add('dc-dragging');
    const layout = () => {
      for (const h of homes) {
        if (h.id === id) continue;
        const slot = liveOrder.indexOf(h.id);
        h.el.style.transform = `translateX(${(slotXs[slot]-h.x)/scale}px)`;
      }
    };
    const move = (ev) => {
      const dx = ev.clientX - startX;
      me.style.transform = `translateX(${dx/scale}px)`;
      const cur = homes[startIdx].x + dx;
      let nearest = 0, best = Infinity;
      for (let i = 0; i < slotXs.length; i++) { const d = Math.abs(slotXs[i]-cur); if (d<best){best=d;nearest=i;} }
      if (liveOrder.indexOf(id) !== nearest) {
        liveOrder = order.filter((k) => k !== id); liveOrder.splice(nearest,0,id); layout();
      }
    };
    const up = () => {
      document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
      const finalSlot = liveOrder.indexOf(id);
      me.classList.remove('dc-dragging');
      me.style.transform = `translateX(${(slotXs[finalSlot]-homes[startIdx].x)/scale}px)`;
      setTimeout(() => {
        for (const h of homes) { h.el.style.transition='none'; h.el.style.transform=''; }
        if (liveOrder.join('|') !== order.join('|')) onReorder(liveOrder);
        requestAnimationFrame(() => requestAnimationFrame(() => { for (const h of homes) h.el.style.transition=''; }));
      },180);
    };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  };
  return (
    <div ref={ref} data-dc-slot={id} style={{ position:'relative',flexShrink:0 }}>
      <div className="dc-labelrow" style={{ position:'absolute',bottom:'100%',left:-4,marginBottom:4,color:DC.label }}>
        <div className="dc-grip" onPointerDown={onGripDown} title="Drag to reorder">
          <svg width="9" height="13" viewBox="0 0 9 13" fill="currentColor"><circle cx="2" cy="2" r="1.1"/><circle cx="7" cy="2" r="1.1"/><circle cx="2" cy="6.5" r="1.1"/><circle cx="7" cy="6.5" r="1.1"/><circle cx="2" cy="11" r="1.1"/><circle cx="7" cy="11" r="1.1"/></svg>
        </div>
        <div className="dc-labeltext" onClick={onFocus} title="Click to focus">
          <DCEditable value={label} onChange={onRename} onClick={(e) => e.stopPropagation()}
            style={{ fontSize:15,fontWeight:500,color:DC.label,lineHeight:1 }}/>
        </div>
      </div>
      <button className="dc-expand" onClick={onFocus} onPointerDown={(e) => e.stopPropagation()} title="Focus">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg>
      </button>
      <div className="dc-card" style={{ borderRadius:2,boxShadow:'0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06)',overflow:'hidden',width,height,background:'#fff',...style }}>
        {children || <div style={{ height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:'#bbb',fontSize:13,fontFamily:DC.font }}>{id}</div>}
      </div>
    </div>
  );
}

function DCEditable({ value, onChange, style, tag='span', onClick }) {
  const T = tag;
  return (
    <T className="dc-editable" contentEditable suppressContentEditableWarning onClick={onClick}
      onPointerDown={(e) => e.stopPropagation()}
      onBlur={(e) => onChange && onChange(e.currentTarget.textContent)}
      onKeyDown={(e) => { if (e.key==='Enter'){e.preventDefault();e.currentTarget.blur();} }}
      style={style}>{value}</T>
  );
}

function DCFocusOverlay({ entry, sectionMeta, sectionOrder }) {
  const ctx = useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const sec = ctx.section(sectionId);
  const meta = sectionMeta[sectionId];
  const peers = meta.slotIds;
  const aid = artboard.props.id ?? artboard.props.label;
  const idx = peers.indexOf(aid);
  const secIdx = sectionOrder.indexOf(sectionId);
  const go = (d) => { const n = peers[(idx+d+peers.length)%peers.length]; if (n) ctx.setFocus(`${sectionId}/${n}`); };
  const goSection = (d) => {
    const ns = sectionOrder[(secIdx+d+sectionOrder.length)%sectionOrder.length];
    const first = sectionMeta[ns]?.slotIds[0];
    if (first) ctx.setFocus(`${ns}/${first}`);
  };
  useEffect(() => {
    const k = (e) => {
      if (e.key==='ArrowLeft'){e.preventDefault();go(-1);}
      if (e.key==='ArrowRight'){e.preventDefault();go(1);}
      if (e.key==='ArrowUp'){e.preventDefault();goSection(-1);}
      if (e.key==='ArrowDown'){e.preventDefault();goSection(1);}
    };
    document.addEventListener('keydown',k);
    return () => document.removeEventListener('keydown',k);
  });
  const { width=260, height=480, children } = artboard.props;
  const [vp, setVp] = useState({ w:window.innerWidth, h:window.innerHeight });
  useEffect(() => { const r=()=>setVp({w:window.innerWidth,h:window.innerHeight}); window.addEventListener('resize',r); return ()=>window.removeEventListener('resize',r); },[]);
  const scale = Math.max(0.1,Math.min((vp.w-200)/width,(vp.h-260)/height,2));
  const [ddOpen,setDd] = useState(false);
  const Arrow = ({dir,onClick}) => (
    <button onClick={(e)=>{e.stopPropagation();onClick();}}
      style={{ position:'absolute',top:'50%',[dir]:28,transform:'translateY(-50%)',border:'none',background:'rgba(255,255,255,.08)',color:'rgba(255,255,255,.9)',width:44,height:44,borderRadius:22,fontSize:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',transition:'background .15s' }}
      onMouseEnter={(e)=>(e.currentTarget.style.background='rgba(255,255,255,.18)')}
      onMouseLeave={(e)=>(e.currentTarget.style.background='rgba(255,255,255,.08)')}>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d={dir==='left'?'M11 3L5 9l6 6':'M7 3l6 6-6 6'}/></svg>
    </button>
  );
  return ReactDOM.createPortal(
    <div onClick={()=>ctx.setFocus(null)} onWheel={(e)=>e.preventDefault()}
      style={{ position:'fixed',inset:0,zIndex:100,background:'rgba(24,20,16,.6)',backdropFilter:'blur(14px)',fontFamily:DC.font,color:'#fff' }}>
      <div onClick={(e)=>e.stopPropagation()} style={{ position:'absolute',top:0,left:0,right:0,height:72,display:'flex',alignItems:'flex-start',padding:'16px 20px 0',gap:16 }}>
        <div style={{ position:'relative' }}>
          <button onClick={()=>setDd((o)=>!o)} style={{ border:'none',background:'transparent',color:'#fff',cursor:'pointer',padding:'6px 8px',borderRadius:6,textAlign:'left',fontFamily:'inherit' }}>
            <span style={{ display:'flex',alignItems:'center',gap:8 }}>
              <span style={{ fontSize:18,fontWeight:600,letterSpacing:-0.3 }}>{meta.title}</span>
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" style={{ opacity:.7 }}><path d="M2 4l3.5 3.5L9 4"/></svg>
            </span>
          </button>
          {ddOpen && (
            <div style={{ position:'absolute',top:'100%',left:0,marginTop:4,background:'#2a251f',borderRadius:8,boxShadow:'0 8px 32px rgba(0,0,0,.4)',padding:4,minWidth:200,zIndex:10 }}>
              {sectionOrder.map((sid)=>(
                <button key={sid} onClick={()=>{setDd(false);const f=sectionMeta[sid].slotIds[0];if(f)ctx.setFocus(`${sid}/${f}`);}}
