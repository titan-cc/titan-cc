name: Check GHCR Pull Credential

# Runs weekly. If the PAT stored in RunPod (also mirrored as GHCR_PULL_PAT
# in repo secrets) can no longer authenticate to GHCR, RunPod workers will
# fail to start with a misleading "unauthorized" error at image pull time.
# This workflow catches that before it becomes a production incident.
#
# Setup (one-time):
#   1. Generate a GitHub PAT with scope: read:packages
#   2. Add it to RunPod: Settings → Registry Credentials → Edit "ghcr-titan-pat"
#   3. Add the same token to GitHub: repo Settings → Secrets → GHCR_PULL_PAT
#   When you rotate: update both places, then re-run this workflow to confirm.

on:
  schedule:
    - cron: "0 8 * * 1"   # Every Monday 08:00 UTC
  workflow_dispatch:       # Allow manual trigger from the Actions tab

jobs:
  check-credential:
    runs-on: ubuntu-latest
    permissions:
      issues: write        # Needed to open the alert issue

    steps:
      - name: Authenticate and check image via GHCR API
        id: auth
        continue-on-error: true
        run: |
          # Use the GHCR token API directly — more reliable than docker manifest
          # inspect for private packages. A 200 response means auth is valid and
          # the image exists. A 401 means the PAT is invalid/expired.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GHCR_PULL_PAT }}" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/runpod-worker/tags/list")
          echo "http_status=${HTTP_STATUS}"
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "GHCR API returned HTTP ${HTTP_STATUS} — credential is invalid or image not found"
            exit 1
          fi

      - name: Determine overall result
        id: result
        run: |
          if [[ "${{ steps.auth.outcome }}" == "failure" ]]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "reason=GHCR API check failed — PAT is expired, revoked, missing read:packages scope, or image not found" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open alert issue if credential is broken
        if: steps.result.outputs.failed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const reason  = "${{ steps.result.outputs.reason }}";
            const title   = "GHCR pull PAT invalid — RunPod workers will fail to start";
            const label   = "ops";

            // Don't open a duplicate if one is already open
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: "open",
              labels: label,
            });
            const alreadyOpen = existing.data.some(i => i.title === title);
            if (alreadyOpen) {
              console.log("Issue already open — skipping duplicate");
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              labels: [label],
              body: [
                "## What happened",
                `The weekly GHCR credential check failed: **${reason}**`,
                "",
                "RunPod workers pull the transcription image from GHCR on every cold start.",
                "Until this is fixed, new pods will fail to initialise and jobs will queue indefinitely.",
                "",
                "## How to fix",
                "1. Go to **GitHub → Settings → Developer Settings → Personal access tokens**",
                "2. Generate a new classic PAT with scope **`read:packages`** (no expiry, or set a long one)",
                "3. Update **RunPod**: Settings → Registry Credentials → Edit `ghcr-titan-pat` → paste new token",
                "4. Update **GitHub secret**: repo Settings → Secrets and variables → Actions → `GHCR_PULL_PAT` → update",
                "5. Manually re-run this workflow (Actions → Check GHCR Pull Credential → Run workflow) to confirm",
                "6. Close this issue once the check passes",
                "",
                "## Reference",
                "- RunPod credential ID: `cmomnlem8003ll706pviemib4` (name: `ghcr-titan-pat`)",
                "- Image: `ghcr.io/titan-cc/runpod-worker:latest`",
                "- RunPod endpoint: `s1qzo6w76dn34l` (titan-transcribe)",
              ].join("\n"),
            });
            console.log("Alert issue created");

      - name: Log success
        if: steps.result.outputs.failed == 'false'
        run: echo "GHCR credential is valid — RunPod workers can pull the image."
